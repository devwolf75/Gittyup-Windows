# Rolling Windows build of upstream master (Murmele/Gittyup).
#
# Runs on a schedule and builds upstream master ONLY when it has new commits.
# The resulting installer and portable ZIP are published to a rolling
# prerelease called "windows-latest". The upstream commit SHA is recorded in
# the release body to detect whether a rebuild is needed.
#
# This workflow checks out the upstream repository directly, so the fork does
# not need to keep its own master in sync for these builds to stay current.

---
name: Windows Latest (upstream master)
on:
  schedule:
  - cron: '0 0 * * *' # daily, 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: '6.7.3'
  UPSTREAM_REPO: Murmele/Gittyup
  ROLLING_TAG: windows-latest

jobs:
  check:
    name: Check for upstream changes
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.compare.outputs.skip }}
      sha: ${{ steps.compare.outputs.sha }}
    steps:
      - name: Compare upstream SHA with last build
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLING_TAG: ${{ env.ROLLING_TAG }}
        run: |
          set -euo pipefail
          SHA=$(git ls-remote https://github.com/${{ env.UPSTREAM_REPO }}.git refs/heads/master | cut -f1)
          echo "Upstream master: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          LAST=$(gh release view "$ROLLING_TAG" --repo "${{ github.repository }}" \
            --json body --jq '.body' 2>/dev/null | grep -oP 'sha:\K[0-9a-f]+' || true)
          echo "Last built: ${LAST:-none}"
          if [ "$LAST" = "$SHA" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "No changes upstream, skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build-win64:
    name: Build Windows x64
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - name: Set git name and email
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"

      - name: Checkout upstream master
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: master
          submodules: recursive

      - name: Install Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.30'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        timeout-minutes: 15
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          host: windows
          arch: win64_msvc2019_64
          install-deps: true

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Setup MSVC environment
        uses: seanmiddleditch/gha-setup-vsdevenv@v5
        with:
          arch: x64

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      # CPack uses NSIS on Windows (see pack/CMakeLists.txt); runners do not ship makensis.
      - name: Install NSIS for CPack
        shell: pwsh
        run: |
          choco install nsis -y
          $nsis = @(
            'C:\Program Files (x86)\NSIS',
            'C:\Program Files\NSIS'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($nsis) { Add-Content $env:GITHUB_PATH $nsis }

      - name: Build OpenSSL
        run: |
          cd dep/openssl/openssl
          perl Configure VC-WIN64A
          nmake

      - name: Configure Release
        env:
          CMAKE_RC_FLAGS: /C 1252
        run: |
          mkdir -p build/release
          cd build/release
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DUPDATE_TRANSLATIONS=ON `
            -DDEV_BUILD="master" `
            -DUSE_SYSTEM_QT=OFF -DUSE_SYSTEM_LIBSSH2=OFF -DUSE_BUNDLED_ZLIB=1 `
            -DUSE_SSH:STRING=localbuild -DUSE_SYSTEM_OPENSSL=OFF `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl ../..

      - name: Build installer (NSIS)
        run: |
          cd build/release
          ninja package

      - name: Build portable (ZIP)
        run: |
          cd build/release
          cpack -G ZIP

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gittyup-win64
          path: |
            build/release/pack/Gittyup-*.exe
            build/release/pack/Gittyup-*.zip
          retention-days: 7

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(build/release/pack/Gittyup*.exe build/release/pack/Gittyup*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No assets to upload."
            exit 1
          fi
          if ! gh release view "${{ env.ROLLING_TAG }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "${{ env.ROLLING_TAG }}" \
              --repo "${{ github.repository }}" \
              --prerelease \
              --title "Windows Latest (upstream master)" \
              --notes "sha:${{ needs.check.outputs.sha }}" \
              --target "${{ github.sha }}" \
              "${files[@]}"
          else
            gh release edit "${{ env.ROLLING_TAG }}" \
              --repo "${{ github.repository }}" \
              --notes "sha:${{ needs.check.outputs.sha }}"
            gh release upload "${{ env.ROLLING_TAG }}" "${files[@]}" \
              --repo "${{ github.repository }}" --clobber
          fi
