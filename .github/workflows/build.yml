# Windows release build (installer + portable) for Gittyup v2.0.0.
# Modernized replacement for the upstream workflow of tag gittyup_v2.0.0,
# whose actions (upload-artifact@v3, set-output, marvinpinto releases) are
# retired and no longer run on GitHub Actions.

---
name: Windows Release
on:
  push:
    tags:
    - 'gittyup_v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: '6.6.0'
  IS_RELEASE: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'gittyup_v') }}

jobs:
  build-win64:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Set git name and email
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.30'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        timeout-minutes: 15
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          host: windows
          arch: win64_msvc2019_64
          install-deps: true

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Setup MSVC environment
        uses: seanmiddleditch/gha-setup-vsdevenv@v5
        with:
          arch: x64

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      # CPack uses NSIS on Windows (see pack/CMakeLists.txt); runners do not ship makensis.
      - name: Install NSIS for CPack
        shell: pwsh
        run: |
          choco install nsis -y
          $nsis = @(
            'C:\Program Files (x86)\NSIS',
            'C:\Program Files\NSIS'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($nsis) { Add-Content $env:GITHUB_PATH $nsis }

      - name: Build OpenSSL
        run: |
          cd dep/openssl/openssl
          perl Configure VC-WIN64A
          nmake

      - name: Configure Release
        env:
          CMAKE_RC_FLAGS: /C 1252
          # v2.0.0 passes GCC-style warning flags (e.g. -Werror=switch) that
          # MSVC cl rejects; upstream built this version with clang instead.
          CC: clang
          CXX: clang++
        run: |
          mkdir -p build/release
          cd build/release
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DUPDATE_TRANSLATIONS=ON `
            -DUSE_SYSTEM_QT=OFF -DUSE_SYSTEM_LIBSSH2=OFF -DUSE_BUNDLED_ZLIB=1 `
            -DUSE_SSH:STRING=localbuild -DUSE_SYSTEM_OPENSSL=OFF ../..

      - name: Build installer (NSIS)
        run: |
          cd build/release
          ninja package

      - name: Build portable (ZIP)
        run: |
          cd build/release
          cpack -G ZIP

      - name: Show artifacts
        run: |
          ls build/release/pack/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gittyup-win64
          path: |
            build/release/pack/Gittyup-*.exe
            build/release/pack/Gittyup-*.zip

  publish:
    name: Publish release
    needs: build-win64
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'gittyup_v') }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/Gittyup-win64/Gittyup*.exe artifacts/Gittyup-win64/Gittyup*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No assets to upload."
            exit 1
          fi
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "Gittyup $TAG (Windows)" \
              --target "${{ github.sha }}" \
              "${files[@]}"
          else
            gh release upload "$TAG" "${files[@]}" --repo "${{ github.repository }}" --clobber
          fi
